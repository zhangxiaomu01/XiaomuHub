name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，新 push 取消旧的
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Sync dist to server
        env:
          # SERVER_SSH_KEY 为部署私钥的单行 base64（避免多行粘贴丢换行）
          SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          HOST: ${{ secrets.SERVER_HOST }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          HOST=$(echo "$HOST" | tr -d '[:space:]')
          printf '%s' "$SSH_KEY" | tr -d '[:space:]' | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -lf ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "ubuntu@$HOST:/var/www/xiaomuhub/"
          ssh -i ~/.ssh/deploy_key "ubuntu@$HOST" "sudo systemctl reload nginx || true"
          echo "Deployed to http://$HOST"
